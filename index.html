<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>samsara design ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<!-- Bricolage: ink-trap grotesque, loaded for section numerals only (digit subset) -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,800&text=0123456789&display=swap" rel="stylesheet">
<style>
:root{
  --signal:#FEAE0F;
  --gray-100:#F5F4F1;
  --gray-200:#EAE8E3;
  --gray-300:#E0DDD5;
  --gray-400:#CCC9C1;
  --gray-500:#B9B6AD;
  --gray-600:#9C9890;
  --gray-700:#716F67;
  --gray-800:#403D37;
  --black-1000:#1C1917;
  --white:#FFFFFF;
  /* secondary palette — Brand Guidelines v1.0 (July 2026), 4.1 */
  --emerald:#01B665;
  --emerald-200:#80DBB2;
  --emerald-900:#013D21;
  --red:#EE2B35;
  --red-200:#F7959A;
  --red-900:#5C0208;
  --orange:#FF6319;
  --orange-200:#FFB18C;
  --orange-900:#5F1E00;
  --sky-200:#A1E1F2;
  --sky-900:#094D60;
  --blue-200:#95BAEA;
  --blue-900:#0C2648;
  --lime-200:#CEF4A3;
  --lime-900:#2A4D07;
  --sans:'Instrument Sans',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--gray-100);color:var(--black-1000);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
}
.wrap{max-width:1020px;margin:0 auto;padding:0 clamp(20px,4vw,48px);width:100%}
.label{
  font-family:var(--mono);font-weight:500;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gray-700);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* site bar — same element as the project plan's header */
header.site{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--gray-100) 92%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--gray-300);
}
header.site .wrap{display:flex;align-items:center;gap:24px;height:64px}
header.site img.wordmark{height:14px;width:auto;display:block}
nav.toc{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.toc a{
  font-family:var(--mono);font-weight:500;font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;color:var(--gray-700);
  padding:6px 10px;border-radius:2px;white-space:nowrap;
  transition:background .18s var(--ease),color .18s var(--ease);
}
nav.toc a:hover{background:var(--gray-200);color:var(--black-1000)}

header.hero{padding:clamp(40px,7vw,84px) 0 clamp(28px,4vw,44px)}
.hero-wrap{position:relative}
.owl-mark{
  position:absolute;top:10px;right:clamp(20px,4vw,48px);
  width:30px;height:auto;color:var(--black-1000);transition:color .3s var(--ease);
}
.owl-mark:hover{color:var(--signal)}
html{scroll-behavior:smooth}
.sec{scroll-margin-top:80px}
.stamp-zone{display:inline-block}
h1{font-weight:700;font-size:clamp(46px,9vw,100px);line-height:.96;letter-spacing:-.03em;cursor:default;outline:none}
h1 .owl{color:var(--signal);display:inline-block;transition:transform .4s var(--ease)}
.stamp-zone:hover h1 .owl,h1:focus-visible .owl{transform:translateY(-.06em) scale(1.12)}

/* last-updated: hidden terminal stamp, revealed by hovering the wordmark */
.updated{
  margin-top:16px;display:inline-flex;align-items:center;gap:9px;
  background:var(--black-1000);color:var(--gray-100);padding:10px 15px;
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  opacity:0;visibility:hidden;transform:translateY(-7px);
  clip-path:inset(0 0 100% 0);
  transition:
    opacity .38s var(--ease),
    transform .46s var(--ease),
    clip-path .46s var(--ease),
    visibility 0s linear .46s;
}
.stamp-zone:hover .updated,h1:focus-visible+.updated,.updated:hover{
  opacity:1;visibility:visible;transform:translateY(0);
  clip-path:inset(-4px -4px -4px -4px);
  transition:
    opacity .3s var(--ease),
    transform .42s var(--ease),
    clip-path .42s var(--ease),
    visibility 0s;
}
.u-prompt{color:var(--gray-600)}
.u-prompt b{color:var(--signal);font-weight:700}
.u-cmd{color:var(--gray-400)}
.u-out{
  color:var(--signal);font-weight:700;
  opacity:0;transform:translateX(-4px);
  transition:opacity .3s var(--ease) .12s,transform .34s var(--ease) .12s;
}
.stamp-zone:hover .u-out,h1:focus-visible+.updated .u-out,.updated:hover .u-out{opacity:1;transform:none}
.u-caret{
  width:7px;height:14px;background:var(--signal);flex:none;
  animation:caret-blink 1.05s steps(1) infinite;
}
@keyframes caret-blink{50%{opacity:0}}

main{flex:1;padding-bottom:clamp(56px,9vw,100px)}
.sec{margin-top:clamp(64px,9vw,120px)}
/* section openers: outlined numeral against display-size title, closed by an ink rule */
.sec-head{
  display:flex;align-items:baseline;gap:clamp(16px,2.4vw,32px);flex-wrap:wrap;
  margin-bottom:clamp(24px,3.5vw,40px);padding-bottom:clamp(14px,2vw,24px);
  border-bottom:2px solid var(--black-1000);
}
.sec-head .num{
  font-family:'Bricolage Grotesque',var(--sans);
  font-weight:800;font-size:clamp(60px,8vw,100px);line-height:.8;letter-spacing:.01em;
  color:transparent;-webkit-text-stroke:1.5px var(--black-1000);
  font-variant-numeric:tabular-nums;
  user-select:none;
}
.sec-head h2{
  font-weight:700;font-size:clamp(38px,5.5vw,64px);line-height:.9;
  letter-spacing:-.03em;text-transform:lowercase;
}
.sec-head .hint{font-size:13px;color:var(--gray-600);margin-left:auto}

/* status legend */
.legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-600)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* project board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
a.card{
  display:flex;flex-direction:column;gap:9px;
  background:var(--white);border:1px solid var(--gray-300);border-top:3px solid var(--gray-400);
  padding:22px 24px 18px;text-decoration:none;color:inherit;position:relative;
  transition:border-color .2s var(--ease),transform .22s var(--ease);
}
a.card:hover{border-color:var(--black-1000);border-top-color:inherit;transform:translateY(-3px)}
a.card .label{color:var(--gray-600)}
a.card strong{font-weight:700;font-size:clamp(18px,2.2vw,22px);letter-spacing:-.01em;line-height:1.15}
a.card p{font-size:13.5px;color:var(--gray-700);line-height:1.45}
a.card .go{
  margin-top:auto;padding-top:12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-600);
  transition:color .18s var(--ease);
}
a.card:hover .go{color:var(--black-1000)}
a.card .go b{color:var(--signal)}
.badges{display:flex;gap:6px;margin-bottom:4px}
.status,.lock{
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;
}
.lock{background:var(--black-1000);color:var(--gray-100)}
.status.s-track{background:var(--emerald-200);color:var(--emerald-900)}
.status.s-build{background:var(--signal);color:var(--black-1000)}
.status.s-risk{background:var(--orange-200);color:var(--orange-900)}
.status.s-blocked{background:var(--red-200);color:var(--red-900)}
.status.s-wrapped{
  color:var(--gray-700);
  background:repeating-linear-gradient(-45deg,var(--gray-200) 0 5px,#E3E0D9 5px 10px);
}
.card.s-track{border-top-color:var(--emerald)}
.card.s-build{border-top-color:var(--signal)}
.card.s-risk{border-top-color:var(--orange)}
.card.s-blocked{border-top-color:var(--red)}

/* wrapped: the party's over but the bunting stays up.
   Dimmed + faintly striped at rest; hover re-saturates the ribbon. */
.card.s-wrapped{
  border-top-color:transparent;
  background:
    repeating-linear-gradient(-45deg,rgba(28,25,23,.03) 0 12px,transparent 12px 24px),
    var(--white);
}
.card.s-wrapped::after{
  content:'';position:absolute;top:-3px;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,
    var(--emerald-200) 0 16px,var(--signal) 16px 32px,var(--sky-200) 32px 48px,
    var(--orange-200) 48px 64px,var(--lime-200) 64px 80px);
  filter:saturate(.85);
  transition:filter .3s var(--ease);
}
.card.s-wrapped strong,.card.s-wrapped p{color:var(--gray-600)}
.card.s-wrapped .label,.card.s-wrapped .go{color:var(--gray-500)}
.card.s-wrapped:hover::after{
  filter:saturate(2.2);
}
.card.s-wrapped:hover{border-top-color:transparent}
.card.s-wrapped:hover strong{color:var(--gray-700)}
.legend .swatch-wrapped{
  width:14px;height:8px;border-radius:2px;display:inline-block;
  background:repeating-linear-gradient(90deg,
    var(--emerald-200) 0 3px,var(--signal) 3px 6px,var(--sky-200) 6px 9px,var(--orange-200) 9px 12px,var(--lime-200) 12px 15px);
  border:1px solid var(--gray-300);
}

/* backlog board */
.pitch-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
#pitch-open{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  background:var(--black-1000);color:var(--gray-100);padding:10px 16px;
  transition:background .2s var(--ease),transform .2s var(--ease);
}
#pitch-open:hover{background:var(--gray-800);transform:translateY(-1px)}
#pitch-open b{color:var(--signal)}

.pitch-form{
  background:var(--white);border:1px solid var(--signal);padding:20px;margin-bottom:20px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.pitch-form.hidden{display:none}
.pitch-form label{display:flex;flex-direction:column;gap:5px}
.pitch-form label span{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-700)}
.pitch-form label span i{color:var(--red);font-style:normal}
.pitch-form input,.pitch-form select,.pitch-form textarea{
  font:inherit;font-size:14px;border:1px solid var(--gray-300);padding:8px 10px;background:var(--gray-100);
}
.pitch-form input:focus,.pitch-form select:focus,.pitch-form textarea:focus{outline:2px solid var(--signal);outline-offset:-1px}
.pitch-form .full{grid-column:1/-1}
.pitch-form textarea{resize:vertical;min-height:70px}
.pitch-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.pitch-actions button[type=submit]{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  background:var(--black-1000);color:var(--gray-100);padding:9px 16px;
}
.pitch-actions button[type=submit]:hover{background:var(--gray-800)}
.pitch-actions .cancel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-600)}
.pitch-error{font-size:12.5px;color:#8a1218}
.pitch-count{font-family:var(--mono);font-size:9.5px;color:var(--gray-500);letter-spacing:.06em}

.view-toggle{margin-left:auto;display:flex;border:1px solid var(--gray-300);background:var(--white)}
.view-toggle button{
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gray-600);padding:8px 13px;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.view-toggle button:hover{color:var(--black-1000)}
.view-toggle button.is-active{background:var(--black-1000);color:var(--gray-100)}
.order-toast{
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gray-600);opacity:0;transition:opacity .3s var(--ease);
}
.order-toast.show{opacity:1}
.order-toast.err{color:#8a1218}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.note-actions{
  position:absolute;top:6px;right:8px;display:flex;gap:2px;align-items:center;
  opacity:0;transition:opacity .18s var(--ease);
}
.note:hover .note-actions,.note.editing .note-actions{opacity:1}
.note-actions button,.note-grip{
  font-family:var(--mono);font-size:11px;line-height:1;color:var(--gray-600);
  padding:3px 5px;transition:color .18s var(--ease);
}
.note-actions button:hover{color:var(--black-1000)}
.note-actions .del:hover{color:#8a1218}
.note-grip{cursor:grab;font-size:12px}
.note-grip:active{cursor:grabbing}
.note.dragging{opacity:.45}

/* inline edit form */
.note.editing{transform:none !important;box-shadow:0 12px 26px rgba(28,25,23,.12)}
.note-form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.note-form input,.note-form select,.note-form textarea{
  font:inherit;font-size:13px;border:1px solid var(--gray-400);background:var(--white);
  padding:6px 8px;width:100%;min-width:0;
}
.note-form input:focus,.note-form select:focus,.note-form textarea:focus{outline:2px solid var(--signal);outline-offset:-1px}
.note-form textarea{resize:vertical;min-height:56px}
.note-form .nf-row{display:flex;gap:8px}
.swatches{display:flex;gap:6px;align-items:center}
.swatches .label{font-size:8.5px}
.swatch{width:22px;height:22px;border:1px solid var(--gray-400);cursor:pointer;padding:0;flex:none}
.swatch.auto{background:repeating-linear-gradient(-45deg,var(--white) 0 4px,var(--gray-200) 4px 8px)}
.swatch.sel{outline:2px solid var(--black-1000);outline-offset:1px}
.nf-actions{display:flex;gap:12px;align-items:center;margin-top:2px}
.nf-actions .save{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  background:var(--black-1000);color:var(--gray-100);padding:8px 14px;
}
.nf-actions .save:hover{background:var(--gray-800)}
.nf-actions .cancel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-600)}

/* toast undo button */
.order-toast button{
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--black-1000);border-bottom:1px solid var(--signal);margin-left:8px;padding:0 1px;
}

/* project hiding */
a.card .card-hide{
  position:absolute;top:8px;right:10px;z-index:2;
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gray-500);padding:3px 6px;opacity:0;transition:opacity .18s var(--ease),color .18s var(--ease);
}
a.card:hover .card-hide{opacity:1}
a.card .card-hide:hover{color:var(--black-1000)}
a.card.is-hidden{opacity:.55;filter:saturate(.5)}
a.card.is-hidden .card-hide{opacity:1}
.hidden-bar{
  margin-top:14px;font-family:var(--mono);font-size:9.5px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gray-600);
}
.hidden-bar button{
  font:inherit;color:var(--gray-700);border-bottom:1px solid var(--gray-400);padding:0 1px;
  transition:color .18s var(--ease);
}
.hidden-bar button:hover{color:var(--black-1000)}

/* list view: same notes, laid flat */
.notes.view-list{display:flex;flex-direction:column;gap:8px}
.notes.view-list .note{
  transform:none !important;box-shadow:none;
  display:grid;grid-template-columns:auto 74px 1fr auto;align-items:center;gap:14px;
  padding:12px 16px;
}
.notes.view-list .note::before{display:none}
.notes.view-list .note .note-actions{position:static;order:-1;opacity:.65}
.notes.view-list .note.editing{display:block}
.notes.view-list .note.editing .note-actions{position:absolute;top:8px;right:10px}
.notes.view-list .note h3{margin:0;font-size:14px}
.notes.view-list .note .body{min-width:0}
.notes.view-list .note p{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;
}
.notes.view-list .note .meta{margin:0;white-space:nowrap}
@media(max-width:640px){
  .notes.view-list .note{grid-template-columns:14px 1fr;grid-auto-rows:auto}
  .notes.view-list .note .meta{grid-column:2}
}
.note{
  position:relative;background:var(--white);border:1px solid var(--gray-300);
  padding:20px 16px 14px;box-shadow:0 6px 16px rgba(28,25,23,.07);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
}
.note:hover{transform:rotate(0deg) translateY(-3px) !important;box-shadow:0 12px 26px rgba(28,25,23,.12)}
.note::before{
  content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;background:var(--signal);
  box-shadow:0 2px 5px rgba(28,25,23,.3);
}
.note.c-tooling{background:var(--sky-200)}
.note.c-site{background:var(--blue-200)}
.note.c-event{background:var(--lime-200)}
.note.c-process{background:var(--emerald-200)}
.note.c-wildcard{background:var(--orange-200)}
.note .cat{font-family:var(--mono);font-size:8.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-700)}
.note h3{font-weight:700;font-size:15.5px;line-height:1.25;letter-spacing:-.01em;margin:5px 0 7px}
.note p{font-size:12.5px;line-height:1.45;color:var(--gray-800)}
.note .meta{margin-top:12px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-600)}
.notes-empty,.notes-error{grid-column:1/-1;font-size:14px;color:var(--gray-600);padding:26px;border:1px dashed var(--gray-400);text-align:center}

/* fat footer — cassette-style: two stacked words, each fitted edge to edge,
   letters rise in on scroll, speckle over ink */
footer.fat{
  position:relative;overflow:hidden;
  /* Samsara Noise/Light on Black 1000 — Brand Guidelines v1.0, asset 1428:14766.
     Speckle rule: max one speckled surface in eye view. This is the one. */
  background:var(--black-1000) url("assets/speckle-dark.png") repeat;
  background-size:446px auto;
  margin-top:clamp(56px,10vw,128px);
  padding:clamp(40px,7vw,104px) 4vw clamp(12px,2vw,28px);
}
.fat-logo{
  display:block;width:38.2%;max-width:420px;height:auto;
  margin-bottom:clamp(28px,5vw,72px);
}
.fat-line{
  display:block;width:max-content;overflow:hidden;
  font-weight:700;line-height:.8;letter-spacing:-.045em;white-space:nowrap;
  color:var(--gray-100);user-select:none;
}
.fat-line+.fat-line{margin-top:.02em}
.fat-line .fat-l{
  display:inline-block;
  transform:translateY(105%);
  transition:transform .7s var(--ease),color .22s var(--ease);
}
footer.fat.in .fat-l{transform:translateY(0)}
footer.fat.in .fat-l:hover{color:var(--signal);transform:translateY(-.04em);transition:transform .3s var(--ease),color .22s var(--ease)}
.fat-line .fat-dot{color:var(--signal)}
@media (prefers-reduced-motion: reduce){.fat-line .fat-l{transform:none !important;transition:none !important}}
@media(max-width:640px){.pitch-form{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none !important}.note{transform:none !important}}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <img class="wordmark" src="assets/samsara-wordmark-gray950.png" alt="Samsara">
    <nav class="toc">
      <a href="#projects">Active projects</a>
      <a href="#backlog">Backlog</a>
      <a href="roster.html">Roster</a>
      <a href="form-form/">Tools</a>
      <!-- future slots: prototyping hub · team locations (URLs TBD) -->
    </nav>
  </div>
</header>

<header class="hero">
  <div class="wrap hero-wrap">

ll="currentColor"/></svg>
    <div class="stamp-zone">
      <h1 id="wordmark" tabindex="0" aria-describedby="updated">design ops<span class="owl">.</span></h1>
      <div class="updated" id="updated" role="status">
        <span class="u-prompt">~/design-ops&nbsp;<b>$</b></span>
        <span class="u-cmd">stat&nbsp;--updated</span>
        <span class="u-out" id="updated-date">—</span>
        <span class="u-caret" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <section class="sec" id="projects">
      <div class="sec-head">
        <span class="num" aria-hidden="true">01</span>
        <h2>active projects</h2>
        <div class="legend">
          <span><i style="background:var(--emerald)"></i>on track</span>
          <span><i style="background:var(--signal)"></i>in build</span>
          <span><i style="background:var(--orange)"></i>at risk</span>
          <span><i style="background:var(--red)"></i>blocked</span>
          <span><i class="swatch-wrapped"></i>wrapped</span>
        </div>
      </div>
      <div class="board" id="board"></div>
      <div class="hidden-bar" id="hidden-bar" hidden></div>
    </section>

    <section class="sec" id="backlog">
      <div class="sec-head">
        <span class="num" aria-hidden="true">02</span>
        <h2>backlog</h2>
      </div>
      <div class="pitch-bar">
        <button id="pitch-open" type="button"><b>+</b>&nbsp; pitch an idea</button>
        <span class="order-toast" id="order-toast" role="status"></span>
        <div class="view-toggle" aria-label="Backlog view">
          <button type="button" data-bview="cards" class="is-active">cards</button>
          <button type="button" data-bview="list">list</button>
        </div>
      </div>

      <form class="pitch-form hidden" id="pitch-form" novalidate>
        <label><span>Idea title <i>*</i></span><input name="title" maxlength="90" placeholder="Give it a headline" required></label>
        <label><span>Your name <i>*</i></span><input name="by" maxlength="60" placeholder="So we know who to high-five" list="roster-names" required></label>
        <label><span>Category <i>*</i></span>
          <select name="category" required>
            <option value="">choose…</option>
            <option value="tooling">tooling — make the team faster</option>
            <option value="site">site — samsara.design ideas</option>
            <option value="event">event — onsites, crits, rituals</option>
            <option value="process">process — how we work</option>
            <option value="wildcard">wildcard — surprise us</option>
          </select>
        </label>
        <label class="full"><span>Why it matters <i>*</i></span><textarea name="why" maxlength="300" placeholder="One or two sentences: the problem it solves or the joy it sparks" required></textarea></label>
        <div class="pitch-actions">
          <button type="submit">pin it</button>
          <button type="button" class="cancel" id="pitch-cancel">cancel</button>
          <span class="pitch-error" id="pitch-error"></span>
          <span class="pitch-count" id="pitch-count"></span>
        </div>
      </form>

      <div class="notes" id="notes"><div class="notes-empty">loading the board…</div></div>
    </section>

  </div>
</main>

<footer class="fat" id="fat" aria-label="product design">
  <img class="fat-logo" src="assets/samsara-wordmark-paper.svg" alt="Samsara">
  <div class="fat-line" data-word="product"></div>
  <div class="fat-line" data-word="design" data-dot="1"></div>
</footer>

<script>
(function () {
  "use strict";

  /* ——— active projects (edit statuses here) ——— */
  var PROJECTS = [
    {
      title: "samsara.design — project plan",
      label: "Project · MVP Aug 31, 2026",
      desc: "The team's living plan: scope, timeline, statuses, comments, checklists, and history — shared and editable.",
      href: "https://samsara-design.pages.dev/project-plan",
      status: "track", statusLabel: "on track", lock: true, go: "open team plan",
    },
    {
      title: "samsara.design — prototype",
      label: "Staging · Friday crits",
      desc: "The talent brand site itself, evolving on staging toward the Aug 31 launch.",
      href: "https://samsara-design.pages.dev",
      status: "build", statusLabel: "in build", lock: true, go: "view staging",
    },
    {
      title: "PD Onsite 2026",
      label: "Event · Jul 21–23, 2026",
      desc: "Participant guide for the San Francisco onsite — agenda, hackathon tracks, dinners, logistics.",
      href: "https://pd-onsite-2026.pages.dev/",
      status: "wrapped", statusLabel: "wrapped", lock: true, go: "open guide",
    },
  ];

  /* board: hide/restore is view-only + per-browser — never touches the projects */
  var board = document.getElementById("board");
  var hiddenBar = document.getElementById("hidden-bar");
  var HIDE_KEY = "ops-hidden-projects";
  var showHidden = false;
  function hiddenSet() {
    try { return new Set(JSON.parse(localStorage.getItem(HIDE_KEY) || "[]")); }
    catch (_) { return new Set(); }
  }
  function setHiddenSet(s) { localStorage.setItem(HIDE_KEY, JSON.stringify(Array.from(s))); }

  function renderBoard() {
    board.innerHTML = "";
    var hidden = hiddenSet();
    var hiddenCount = 0;
    PROJECTS.forEach(function (p) {
      var isHid = hidden.has(p.href);
      if (isHid) { hiddenCount++; if (!showHidden) return; }
      var a = document.createElement("a");
      a.className = "card s-" + p.status + (isHid ? " is-hidden" : "");
      a.href = p.href;
      var badges = document.createElement("div");
      badges.className = "badges";
      var st = document.createElement("span");
      st.className = "status s-" + p.status;
      st.textContent = p.statusLabel;
      badges.appendChild(st);
      if (p.lock) {
        var lk = document.createElement("span");
        lk.className = "lock";
        lk.textContent = "log in";
        badges.appendChild(lk);
      }
      a.appendChild(badges);
      var lab = document.createElement("span");
      lab.className = "label";
      lab.textContent = p.label;
      a.appendChild(lab);
      var strong = document.createElement("strong");
      strong.textContent = p.title;
      a.appendChild(strong);
      var desc = document.createElement("p");
      desc.textContent = p.desc;
      a.appendChild(desc);
      var go = document.createElement("span");
      go.className = "go";
      go.innerHTML = p.go + ' <b>→</b>';
      a.appendChild(go);
      var hideBtn = document.createElement("button");
      hideBtn.type = "button";
      hideBtn.className = "card-hide";
      hideBtn.textContent = isHid ? "restore" : "hide";
      hideBtn.title = isHid
        ? "Show this project on the board again"
        : "Hide from this view only \u2014 the project itself is untouched";
      hideBtn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var s = hiddenSet();
        if (isHid) {
          s.delete(p.href); setHiddenSet(s); renderBoard();
          toast("project restored");
        } else {
          s.add(p.href); setHiddenSet(s); renderBoard();
          toast("hidden from this view", false, { label: "undo", fn: function () {
            var s2 = hiddenSet(); s2.delete(p.href); setHiddenSet(s2); renderBoard();
          }});
        }
      });
      a.appendChild(hideBtn);
      board.appendChild(a);
    });
    if (hiddenCount > 0) {
      hiddenBar.hidden = false;
      hiddenBar.innerHTML = "";
      hiddenBar.appendChild(document.createTextNode(hiddenCount + " hidden \u00b7 "));
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = showHidden ? "tuck away" : "show";
      b.addEventListener("click", function () { showHidden = !showHidden; renderBoard(); });
      hiddenBar.appendChild(b);
    } else {
      hiddenBar.hidden = true;
    }
  }
  renderBoard();

  /* ——— roster: selection options for "by" fields (and downstream assignments) ——— */
  var ROSTER_API = location.hostname === "localhost"
    ? "http://localhost:8788/api/roster"
    : "https://samsara-design.pages.dev/api/roster";
  var rosterList = document.createElement("datalist");
  rosterList.id = "roster-names";
  document.body.appendChild(rosterList);
  fetch(ROSTER_API)
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (roster) {
      roster.forEach(function (p) {
        if (!p.name) return;
        var o = document.createElement("option");
        o.value = p.name;
        rosterList.appendChild(o);
      });
    })
    .catch(function () {});

  /* ——— fat footer: stacked words, each fitted edge to edge, staggered reveal ——— */
  var fat = document.getElementById("fat");
  var fatLines = [].slice.call(fat.querySelectorAll(".fat-line"));
  var letterIndex = 0;
  fatLines.forEach(function (line) {
    var word = line.dataset.word;
    word.split("").forEach(function (ch) {
      var s = document.createElement("span");
      s.className = "fat-l";
      s.textContent = ch;
      s.style.transitionDelay = (letterIndex * 34) + "ms";
      letterIndex++;
      line.appendChild(s);
    });
    if (line.dataset.dot) {
      var d = document.createElement("span");
      d.className = "fat-l fat-dot";
      d.textContent = ".";
      d.style.transitionDelay = (letterIndex * 34) + "ms";
      letterIndex++;
      line.appendChild(d);
    }
  });
  function fitFat() {
    var avail = fat.clientWidth * 0.92;
    fatLines.forEach(function (line) {
      line.style.fontSize = "100px";
      var w = line.scrollWidth;
      if (w > 0) line.style.fontSize = Math.floor(100 * avail / w) + "px";
    });
  }
  fitFat();
  window.addEventListener("resize", fitFat);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitFat);
  function revealFat() {
    fat.classList.add("in");
    // clear stagger delays once the rise finishes so hover feels instant
    setTimeout(function () {
      fat.querySelectorAll(".fat-l").forEach(function (s) {
        s.style.transitionDelay = "0ms";
      });
    }, letterIndex * 34 + 750);
  }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries, obs) {
      if (entries[0].isIntersecting) {
        revealFat();
        obs.disconnect();
      }
    }, { threshold: 0.25 }).observe(fat);
  } else {
    revealFat();
  }

  /* ——— last updated ——— */
  var out = document.getElementById("updated-date");
  function show(d) {
    var MO = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    var days = Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
    var rel = days === 0 ? "today" : days === 1 ? "1d ago" : days + "d ago";
    out.textContent = MO[d.getMonth()] + " " + d.getDate() + " " + d.getFullYear() + " · " + rel;
  }
  fetch("https://api.github.com/repos/vrthurman/vrthurman.github.io/commits?per_page=1")
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (j) { show(new Date(j[0].commit.committer.date)); })
    .catch(function () {
      var f = document.lastModified ? new Date(document.lastModified) : null;
      if (f && !isNaN(f)) show(f); else out.textContent = "recently";
    });

  /* ——— backlog board ——— */
  var API = location.hostname === "localhost"
    ? "http://localhost:8788/api/backlog"
    : "https://samsara-design.pages.dev/api/backlog";
  var notes = document.getElementById("notes");
  var toastEl = document.getElementById("order-toast");
  var VIEW_KEY = "ops-backlog-view";
  var PW_KEY = "ops-backlog-pw";
  var toastTimer = null;

  function toast(msg, isErr, action) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("err", !!isErr);
    if (action) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = action.label;
      b.addEventListener("click", function () {
        toastEl.classList.remove("show");
        action.fn();
      });
      toastEl.appendChild(b);
    }
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, action ? 8000 : 3200);
  }

  /* one password prompt, cached for the session, shared by every change */
  function authedJson(method, bodyObj) {
    var pw = sessionStorage.getItem(PW_KEY) || prompt("Site password \u2014 needed to save changes:");
    if (!pw) return Promise.reject(new Error("no password \u2014 not saved"));
    return fetch(API, {
      method: method,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Basic " + btoa("ops:" + pw),
      },
      body: JSON.stringify(bodyObj),
    }).then(function (r) {
      if (r.status === 401) {
        sessionStorage.removeItem(PW_KEY);
        throw new Error("wrong password \u2014 not saved");
      }
      if (!r.ok) throw new Error("couldn't save");
      sessionStorage.setItem(PW_KEY, pw);
      return r.json();
    });
  }

  function rotFor(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 997;
    return ((h % 30) - 15) / 10; // -1.5° … +1.4°
  }

  /* view toggle (cards | list), remembered per browser */
  function applyView(v) {
    notes.classList.toggle("view-list", v === "list");
    document.querySelectorAll(".view-toggle button").forEach(function (b) {
      b.classList.toggle("is-active", b.dataset.bview === v);
    });
    localStorage.setItem(VIEW_KEY, v);
  }
  document.querySelectorAll(".view-toggle button").forEach(function (b) {
    b.addEventListener("click", function () { applyView(b.dataset.bview); });
  });
  applyView(localStorage.getItem(VIEW_KEY) === "list" ? "list" : "cards");

  /* board order = priority: top of the board (index 0) is highest */
  function renderNotes(items) {
    notes.innerHTML = "";
    if (!items.length) {
      var empty = document.createElement("div");
      empty.className = "notes-empty";
      empty.textContent = "Nothing pitched yet. Be the first — the board remembers pioneers.";
      notes.appendChild(empty);
      return;
    }
    items.forEach(function (it) {
      var n = document.createElement("div");
      n.className = "note c-" + it.category;
      n.dataset.id = it.id;
      n.style.transform = "rotate(" + rotFor(it.id) + "deg)";
      if (it.color && NOTE_COLORS[it.color]) n.style.background = NOTE_COLORS[it.color];
      n.draggable = true;

      var actions = document.createElement("div");
      actions.className = "note-actions";
      var grip = document.createElement("span");
      grip.className = "note-grip";
      grip.title = "drag to reorder — top of the board = top priority";
      grip.textContent = "⠿";
      actions.appendChild(grip);
      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.textContent = "✎";
      editBtn.title = "Edit this idea";
      editBtn.addEventListener("click", function () { enterEdit(n, it); });
      actions.appendChild(editBtn);
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "del";
      delBtn.textContent = "×";
      delBtn.title = "Delete (undo-able)";
      delBtn.addEventListener("click", function () { deleteItem(it); });
      actions.appendChild(delBtn);
      n.appendChild(actions);

      var cat = document.createElement("span");
      cat.className = "cat";
      cat.textContent = it.category;
      n.appendChild(cat);
      var body = document.createElement("div");
      body.className = "body";
      var h3 = document.createElement("h3");
      h3.textContent = it.title;
      body.appendChild(h3);
      var p = document.createElement("p");
      p.textContent = it.why;
      body.appendChild(p);
      n.appendChild(body);
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "pinned by " + it.by + " · " + new Date(it.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      n.appendChild(meta);

      n.addEventListener("dragstart", function (e) {
        if (n.classList.contains("editing")) { e.preventDefault(); return; }
        dragEl = n;
        n.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", it.id); } catch (_) {}
      });
      n.addEventListener("dragend", function () {
        n.classList.remove("dragging");
        dragEl = null;
      });

      notes.appendChild(n);
    });
  }

  /* ——— edit / delete / color ——— */
  var NOTE_COLORS = { sky: "#A1E1F2", blue: "#95BAEA", lime: "#CEF4A3", emerald: "#80DBB2", orange: "#FFB18C", red: "#F7959A" };
  var CATEGORIES = ["tooling", "site", "event", "process", "wildcard"];

  function enterEdit(n, it) {
    if (n.classList.contains("editing")) return;
    n.classList.add("editing");
    n.draggable = false;
    n.innerHTML = "";
    var chosen = it.color || "";

    var form = document.createElement("div");
    form.className = "note-form";

    var title = document.createElement("input");
    title.maxLength = 90; title.value = it.title; title.placeholder = "idea title";
    form.appendChild(title);

    var why = document.createElement("textarea");
    why.maxLength = 300; why.value = it.why; why.placeholder = "why it matters";
    form.appendChild(why);

    var row = document.createElement("div");
    row.className = "nf-row";
    var by = document.createElement("input");
    by.maxLength = 60; by.value = it.by; by.placeholder = "pinned by";
    by.setAttribute("list", "roster-names");
    row.appendChild(by);
    var sel = document.createElement("select");
    CATEGORIES.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c; o.textContent = c;
      if (c === it.category) o.selected = true;
      sel.appendChild(o);
    });
    row.appendChild(sel);
    form.appendChild(row);

    var sw = document.createElement("div");
    sw.className = "swatches";
    var swLabel = document.createElement("span");
    swLabel.className = "label";
    swLabel.textContent = "color";
    sw.appendChild(swLabel);
    function mkSwatch(key, bg, titleTxt) {
      var s = document.createElement("button");
      s.type = "button";
      s.className = "swatch" + (key === "" ? " auto" : "") + (chosen === key ? " sel" : "");
      if (bg) s.style.background = bg;
      s.title = titleTxt;
      s.addEventListener("click", function () {
        chosen = key;
        sw.querySelectorAll(".swatch").forEach(function (x) { x.classList.remove("sel"); });
        s.classList.add("sel");
      });
      return s;
    }
    sw.appendChild(mkSwatch("", null, "auto — follows the category"));
    Object.keys(NOTE_COLORS).forEach(function (k) {
      sw.appendChild(mkSwatch(k, NOTE_COLORS[k], k));
    });
    form.appendChild(sw);

    var acts = document.createElement("div");
    acts.className = "nf-actions";
    var save = document.createElement("button");
    save.type = "button"; save.className = "save"; save.textContent = "save";
    save.addEventListener("click", function () {
      save.disabled = true; save.textContent = "saving…";
      authedJson("PATCH", {
        id: it.id,
        title: title.value.trim(),
        why: why.value.trim(),
        by: by.value.trim(),
        category: sel.value,
        color: chosen,
      }).then(function () {
        loadNotes();
        toast("saved");
      }).catch(function (e) {
        save.disabled = false; save.textContent = "save";
        toast(String(e.message || e), true);
      });
    });
    acts.appendChild(save);
    var cancel = document.createElement("button");
    cancel.type = "button"; cancel.className = "cancel"; cancel.textContent = "cancel";
    cancel.addEventListener("click", loadNotes);
    acts.appendChild(cancel);
    form.appendChild(acts);

    n.appendChild(form);
    title.focus();
  }

  function deleteItem(it) {
    authedJson("PATCH", { id: it.id, deleted: true }).then(function () {
      loadNotes();
      toast("\u201c" + it.title + "\u201d deleted", false, { label: "undo", fn: function () {
        authedJson("PATCH", { id: it.id, deleted: false })
          .then(loadNotes)
          .catch(function (e) { toast(String(e.message || e), true); });
      }});
    }).catch(function (e) {
      toast(String(e.message || e), true);
    });
  }

  /* ——— drag to reorder (shared priority) ——— */
  var dragEl = null;

  function noteAfterPointer(x, y) {
    var els = [].slice.call(notes.querySelectorAll(".note:not(.dragging)"));
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      var sameRow = y >= r.top && y <= r.bottom;
      if (y < r.top || (sameRow && x < r.left + r.width / 2)) return els[i];
    }
    return null;
  }

  notes.addEventListener("dragover", function (e) {
    if (!dragEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    var after = noteAfterPointer(e.clientX, e.clientY);
    if (after === dragEl) return;
    notes.insertBefore(dragEl, after);
  });

  notes.addEventListener("drop", function (e) {
    if (!dragEl) return;
    e.preventDefault();
    saveOrder();
  });

  function saveOrder() {
    var order = [].slice.call(notes.querySelectorAll(".note")).map(function (n) {
      return n.dataset.id;
    });
    authedJson("PUT", { order: order })
      .then(function () { toast("order saved for everyone"); })
      .catch(function (err) {
        toast(String(err.message || "couldn't save order"), true);
        loadNotes();
      });
  }

  function loadNotes() {
    fetch(API)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(renderNotes)
      .catch(function () {
        notes.innerHTML = "";
        var err = document.createElement("div");
        err.className = "notes-error";
        err.textContent = "The board is napping (backlog service unreachable). Try again in a minute.";
        notes.appendChild(err);
      });
  }
  loadNotes();

  /* ——— pitch form ——— */
  var form = document.getElementById("pitch-form");
  var openBtn = document.getElementById("pitch-open");
  var errEl = document.getElementById("pitch-error");
  var countEl = document.getElementById("pitch-count");
  var why = form.querySelector("[name=why]");

  openBtn.addEventListener("click", function () {
    form.classList.toggle("hidden");
    if (!form.classList.contains("hidden")) form.querySelector("[name=title]").focus();
  });
  document.getElementById("pitch-cancel").addEventListener("click", function () {
    form.classList.add("hidden");
    errEl.textContent = "";
  });
  why.addEventListener("input", function () {
    countEl.textContent = why.value.length + "/300";
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errEl.textContent = "";
    var data = {
      title: form.title.value.trim(),
      by: form.by.value.trim(),
      category: form.category.value,
      why: form.why.value.trim(),
    };
    for (var k in data) {
      if (!data[k]) {
        errEl.textContent = "All fields are required — that's what keeps the board tidy.";
        return;
      }
    }
    var btn = form.querySelector("[type=submit]");
    btn.disabled = true;
    btn.textContent = "pinning…";
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j && res.j.error || "submission failed");
        form.reset();
        countEl.textContent = "";
        form.classList.add("hidden");
        loadNotes();
      })
      .catch(function (err2) {
        errEl.textContent = String(err2.message || err2);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "pin it";
      });
  });
})();
</script>

</body>
</html>
